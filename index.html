<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flocus - Aesthetic Stopwatch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Roboto+Mono&display=swap"
      rel="stylesheet"
    />
    <style>
      @font-face {
        font-family: "Degular Bold";
        src: url("https://dl.dropboxusercontent.com/scl/fi/j82yq4205cz5eubpmffd3/DegularDisplay-Bold.otf?rlkey=i4o03w68952hx9w6c1zrsdyl6&st=tzcby9bz&dl=0&raw=1")
          format("opentype");
        font-weight: 700;
        font-style: normal;
      }
      @font-face {
        font-family: "Degular SemiBold";
        src: url("https://dl.dropboxusercontent.com/scl/fi/j82yq4205cz5eubpmffd3/DegularDisplay-Bold.otf?rlkey=i4o03w68952hx9w6c1zrsdyl6&st=j8dgpq1o&dl=0&raw=1")
          format("opentype");
        font-weight: 700;
        font-style: normal;
      }
      body {
        font-family: "Degular Bold", "Degular SemiBold", sans-serif;
      }
      .sidebar-font {
        font-family: "Poppins", monospace;
      }
      .body-overlay::after {
        content: "";
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, var(--opac));
        z-index: -10;
      }
      .stopwatch {
        line-height: 1;
        letter-spacing: 0.3rem;
      }
      .stopwatch-current {
        font-size: 2.25rem;
        font-weight: 600;
        margin-bottom: 1rem;
        font-family: "Degular Semibold", sans-serif;
        margin-top: -1rem;
      }
      .actions {
        font-family: "Degular Semibold", sans-serif;
        font-size: 1.5rem;
      }
      .undo-action {
        font-size: 3rem;
      }
      .version {
        display: block;
        font-size: 0.75rem;
        color: #a0a0a0;
      }
      .selected {
        border: 2px solid #fff;
      }
    </style>
  </head>

    <!-- Main Stopwatch -->

      <div
        id="stopwatch"
        class="stopwatch text-white text-[7rem] md:text-[13rem]"
      >
        00:00
      </div>
      <div id="currentTime" class="text-purple-300 stopwatch-current">
        Current: 00:00
      </div>
      <div class="space-x-2 flex items-center justify-center">
        <button
          id="startPauseBtn"
          class="actions bg-[#7432FF] h-[48px] text-white px-10 rounded-2xl hover:bg-purple-700 transition-all duration-300 transform hover:scale-105 active:scale-95 min-h-[42px]"
        >
          Start
        </button>
        <button
          id="lapBtn"
          class="actions border-2 text-white px-5 h-[48px] rounded-2xl hover:bg-[#7432FF] hover:border-0 transition-all duration-300 transform hover:scale-105 active:scale-95"
        >
          Lap
        </button>

          id="resetBtn"
          class="undo-action text-bold text-white px-2 rounded-2xl hover:bg-gray-700 transition-all duration-300 transform hover:scale-105 active:scale-95"
        >

            xmlns="http://www.w3.org/2000/svg"

    <!-- Sidebar -->
    <div
      id="sidebar"
      class="fixed top-0 right-0 h-full w-[100vw] md:w-[40vw] bg-black transform translate-x-full transition-transform duration-500 ease-in-out"
    >
      <div class="p-4">
        <button id="closeSidebar" class="text-white text-[2rem]">×</button>
        <h2 class="text-white text-[2rem] font-bold mt-4 sidebar-font">
          Theme
        </h2>
        <div class="mt-4 space-y-4">
          <div
            class="flex items-center space-x-2 cursor-pointer"
            onclick="changeTheme('lofi')"
          >
            <div
              id="theme-image"
              class="w-16 h-12 bg-cover bg-center rounded"
              style="
                background-image: url('https://flocus.com/aesthetic-stopwatch/resources/images/themes/b075c800cadd3c9d930f.jpg');
              "
            ></div>
            <span class="text-white text-bold pl-2 sidebar-font"
              >Lo-Fi Cafe</span
            >
          </div>
          <div
            class="flex items-center space-x-2 cursor-pointer"
            onclick="changeTheme('gradient')"
          >
            <div
              id="theme-gradiant"
              class="w-16 h-12 bg-gradient-to-r from-purple-500 to-pink-500 rounded"
            ></div>
            <span class="text-white text-bold pl-2 sidebar-font"
              >Aura Twilight</span
            >
          </div>
          <div
            class="flex items-center space-x-2 cursor-pointer"
            onclick="changeTheme('black')"
          >
            <div
              id="theme-black"
              class="w-16 h-12 bg-black rounded flex items-center justify-center text-white"
            >
              8:24
            </div>
            <span class="text-white text-bold pl-2 sidebar-font"
              >Minimalist Black</span
            >
          </div>
        </div>
        <div class="version mt-4 sidebar-font">
          Your version number is: v1.0
        </div>
      </div>
    </div>

    <script>
      let stopwatchInterval;
      let stopwatchSeconds = 0;
      let currentSeconds = 0;
      let isRunning = false;

      const stopwatchDisplay = document.getElementById("stopwatch");
      const currentTimeDisplay = document.getElementById("currentTime");
      const startPauseBtn = document.getElementById("startPauseBtn");
      const lapBtn = document.getElementById("lapBtn");
      const resetBtn = document.getElementById("resetBtn");
      const settingsBtn = document.getElementById("settingsBtn");
      const fullscreenBtn = document.getElementById("fullscreenBtn");
      const sidebar = document.getElementById("sidebar");
      const closeSidebar = document.getElementById("closeSidebar");
      const mainBody = document.getElementById("main-body");
      const themeImage = document.getElementById("theme-image");
      const themeGradiant = document.getElementById("theme-gradiant");
      const themeBlack = document.getElementById("theme-black");

      // Format time
      function formatTime(seconds) {
        const mins = Math.floor(seconds / 60)
          .toString()
          .padStart(2, "0");
        const secs = (seconds % 60).toString().padStart(2, "0");
        return `${mins}:${secs}`;
      }

      // Update displays
      function updateDisplays() {
        stopwatchDisplay.textContent = formatTime(stopwatchSeconds);
        currentTimeDisplay.textContent = `Current: ${formatTime(
          currentSeconds
        )}`;
      }

      // Timer logic
      function startTimer() {
        stopwatchInterval = setInterval(() => {
          stopwatchSeconds++;
          currentSeconds++;
          updateDisplays();
        }, 1000);
      }

      // Start/Pause button
      startPauseBtn.addEventListener("click", () => {
        if (!isRunning) {
          startTimer();
          startPauseBtn.textContent = "Pause";
          isRunning = true;
        } else {
          clearInterval(stopwatchInterval);
          startPauseBtn.textContent = "Start";
          isRunning = false;
        }
      });

      // Lap button
      lapBtn.addEventListener("click", () => {
        currentSeconds = 0;
        updateDisplays();
      });

      // Reset button
      resetBtn.addEventListener("click", () => {
        clearInterval(stopwatchInterval);
        stopwatchSeconds = 0;
        currentSeconds = 0;
        isRunning = false;
        startPauseBtn.textContent = "Start";
        updateDisplays();
      });

      // Sidebar toggle
      settingsBtn.addEventListener("click", () => {
        sidebar.classList.remove("translate-x-full");
        sidebar.classList.add("translate-x-0");
      });

      closeSidebar.addEventListener("click", () => {
        sidebar.classList.remove("translate-x-0");
        sidebar.classList.add("translate-x-full");
      });

      // Theme changing
      function changeTheme(theme) {
        if (theme === "lofi") {
          mainBody.style.backgroundImage =
            "url('https://flocus.com/aesthetic-stopwatch/resources/images/themes/b075c800cadd3c9d930f.jpg')";
          mainBody.classList.add("body-overlay");
          themeImage.classList.add("selected");
          themeGradiant.classList.remove("selected");
          themeBlack.classList.remove("selected");
          mainBody.style.backgroundSize = "cover";
          mainBody.style.backgroundPosition = "center";
        } else if (theme === "gradient") {
          mainBody.style.backgroundImage =
            "radial-gradient(circle,rgba(254, 125, 60, 1) 0%, rgba(244, 106, 168, 1) 50%, rgba(146, 107, 252, 1) 100%)";
          mainBody.classList.remove("body-overlay");
          themeImage.classList.remove("selected");
          themeGradiant.classList.add("selected");
          themeBlack.classList.remove("selected");
        } else {
          mainBody.style.backgroundImage = "none";
          mainBody.style.backgroundColor = "black";
          mainBody.classList.remove("body-overlay");
          themeImage.classList.remove("selected");
          themeGradiant.classList.remove("selected");
          themeBlack.classList.add("selected");
        }
      }

      // Fullscreen toggle
      fullscreenBtn.addEventListener("click", () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen();
        } else {
          document.exitFullscreen();
        }
      });

      // Initial theme
      changeTheme("lofi");
    </script>
  </body>
</html>
